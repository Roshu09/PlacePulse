services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"

  # Kafka-compatible broker, much lighter on RAM than Apache Kafka
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"

  redpanda-console:
    image: redpandadata/console:latest
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8089:8080"
    depends_on:
      - redpanda

  auth-service:
    build: ./services/auth-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TPR_INVITE_CODE: ${TPR_INVITE_CODE:-}
      KAFKA_BROKERS: redpanda:29092
      JAVA_TOOL_OPTIONS: -Xmx256m
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started

  drive-service:
    build: ./services/drive-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/drive_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8081
      KAFKA_BROKERS: redpanda:29092
      JAVA_TOOL_OPTIONS: -Xmx256m
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      redpanda:
        condition: service_started

  notification-service:
    build: ./services/notification-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKERS: redpanda:29092
      JAVA_TOOL_OPTIONS: -Xmx256m
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started

  ai-service:
    build: ./services/ai-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DRIVE_SERVICE_URL: http://drive-service:8082
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    ports:
      - "8084:8084"
    volumes:
      - embedmodels:/models
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  embedmodels:
  pgdata:
