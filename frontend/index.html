<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e3b32" />
    <title>PlacePulse</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Light is the default. Dark is used only after the person switches to it themselves.
      // Applied before first paint so there is no light/dark flash.
      try {
        if (localStorage.getItem('pp-theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
