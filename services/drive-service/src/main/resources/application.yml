server:
  port: 8082

spring:
  application:
    name: drive-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/drive_db}
    username: ${DB_USER:placepulse}
    password: ${DB_PASSWORD:change_me}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6381}
      timeout: 500ms
      connect-timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: drive-service
      # a brand-new group reads the topic from the start, so no profile edit is missed on first run
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        # if the broker is down, give up quickly instead of hanging a user request for a minute
        max.block.ms: 2000
        request.timeout.ms: 3000
        delivery.timeout.ms: 6000
  servlet:
    multipart:
      # a logo is capped at 500 KB in the service; this is only the outer limit that protects the server
      max-file-size: 1MB
      max-request-size: 2MB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  health:
    redis:
      # a Redis outage only slows the dashboard; it must not mark the whole service DOWN
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cache:
    enabled: ${CACHE_ENABLED:true}
    analytics-ttl-seconds: 60
  events:
    enabled: ${EVENTS_ENABLED:true}
    topic: placepulse.events
  jwt:
    # Must be the SAME secret as auth-service: that is how this service trusts its tokens.
    secret: ${JWT_SECRET:dev_only_secret_change_me_dev_only_secret}
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  # "Last date to apply" is judged in this time zone
  zone: ${APP_ZONE:Asia/Kolkata}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
