name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, drive-service, notification-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # Java 25 breaks the Mockito tests, so pin 21
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      # tests run on in-memory H2 and mock Kafka and Redis, so no services are needed here
      - run: mvn -B -ntp verify

  ai-service:
    name: ai-service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # same as the Dockerfile
          cache: pip
          cache-dependency-path: services/ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # tests use a fake embedder and a fake LLM, so no model download and no Groq key
      - run: pytest -q

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # type-checks with tsc, then builds with Vite
      - run: npm run build

  docker:
    name: ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: [java, ai-service]
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, drive-service, notification-service, ai-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # builds the image to prove the Dockerfile works; nothing is pushed anywhere
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
